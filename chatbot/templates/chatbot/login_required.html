{% extends "chatbot/base.html" %}
{% block title %}Login Required{% endblock %}
{% block content %}
<style>
.auth-page { min-height:100vh; display:flex; align-items:center; justify-content:center; position:relative; z-index:1; }
.auth-card { width:100%; max-width:400px; background:var(--bg-card); border:1px solid var(--border); border-radius:20px; padding:40px; text-align:center; box-shadow:var(--shadow-lg); }
</style>
<div class="auth-page">
  <div class="auth-card">
    <div style="font-size:52px;margin-bottom:16px;">🔐</div>
    <h2 style="font-size:22px;font-weight:800;margin-bottom:8px;">Login Required</h2>
    <p style="font-size:14px;color:var(--text-muted);margin-bottom:24px;">You need to be signed in to use MeetMind.</p>
    <div style="display:flex;gap:10px;justify-content:center;">
      <a href="{% url 'login' %}" class="btn btn-primary"><i class="fas fa-sign-in-alt"></i> Sign In</a>
      <a href="{% url 'register' %}" class="btn btn-secondary"><i class="fas fa-user-plus"></i> Register</a>
    </div>
  </div>
</div>
{% endblock %}
