{% extends "chatbot/base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<style>
  body { background: var(--bg-primary); }
  .auth-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    z-index: 1;
  }
  .auth-card {
    width: 100%;
    max-width: 420px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 36px;
    box-shadow: var(--shadow-lg);
    animation: fadeUp .5s ease;
  }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(20px); }
    to   { opacity:1; transform: translateY(0); }
  }
  .auth-logo { text-align: center; margin-bottom: 28px; }
  .auth-logo .logo-icon {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
    border-radius: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 26px;
    box-shadow: 0 8px 25px rgba(124,58,237,0.4);
    margin-bottom: 12px;
  }
  .auth-logo h1 { font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
  .auth-logo h1 span { color: var(--accent-purple); }
  .auth-logo p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .auth-divider { text-align: center; font-size: 12px; color: var(--text-muted); margin: 20px 0; }
  .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted); }
  .auth-footer a { color: var(--accent-purple); text-decoration: none; font-weight: 600; }
  .auth-footer a:hover { text-decoration: underline; }
  .input-icon-wrap { position: relative; }
  .input-icon-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; pointer-events: none; }
  .input-icon-wrap .form-control { padding-left: 40px; }
</style>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">🧠</div>
      <h1>Meet<span>Mind</span></h1>
      <p>AI-Powered Meeting Assistant</p>
    </div>

    {% if error %}
    <div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
    {% endif %}

    <form method="post" autocomplete="on">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Username</label>
        <div class="input-icon-wrap">
          <i class="fas fa-user"></i>
          <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-icon-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" name="password" id="pwd" class="form-control" placeholder="Enter your password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-full" style="justify-content:center; padding: 12px;">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="{% url 'register' %}">Create one free</a>
    </div>
  </div>
</div>
{% endblock %}
