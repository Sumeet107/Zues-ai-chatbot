{% extends "chatbot/base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<style>
  .auth-page {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; position: relative; z-index: 1;
  }
  .auth-card {
    width: 100%; max-width: 440px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 36px;
    box-shadow: var(--shadow-lg);
    animation: fadeUp .5s ease;
  }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(20px); }
    to   { opacity:1; transform: translateY(0); }
  }
  .auth-logo { text-align: center; margin-bottom: 28px; }
  .auth-logo .logo-icon {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
    border-radius: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 26px;
    box-shadow: 0 8px 25px rgba(124,58,237,0.4);
    margin-bottom: 12px;
  }
  .auth-logo h1 { font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
  .auth-logo h1 span { color: var(--accent-purple); }
  .auth-logo p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted); }
  .auth-footer a { color: var(--accent-purple); text-decoration: none; font-weight: 600; }
  .input-icon-wrap { position: relative; }
  .input-icon-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; pointer-events: none; }
  .input-icon-wrap .form-control { padding-left: 40px; }
  .pwd-strength { height: 4px; border-radius: 2px; background: var(--border); margin-top: 8px; overflow: hidden; }
  .pwd-strength-bar { height: 100%; width: 0; border-radius: 2px; transition: width .3s, background .3s; }
</style>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">✨</div>
      <h1>Join <span>MeetMind</span></h1>
      <p>Set up your AI meeting assistant</p>
    </div>

    {% if error %}
    <div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
    {% endif %}

    <form method="post" autocomplete="off">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Username</label>
        <div class="input-icon-wrap">
          <i class="fas fa-user"></i>
          <input type="text" name="username" class="form-control" placeholder="Choose a username" required autofocus>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
        <div class="input-icon-wrap">
          <i class="fas fa-envelope"></i>
          <input type="email" name="email" class="form-control" placeholder="your@email.com">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-icon-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" name="password" id="pwd" class="form-control" placeholder="Min 6 characters" required>
        </div>
        <div class="pwd-strength"><div class="pwd-strength-bar" id="pwdBar"></div></div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <div class="input-icon-wrap">
          <i class="fas fa-shield-alt"></i>
          <input type="password" name="confirm" class="form-control" placeholder="Repeat your password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-full" style="justify-content:center; padding: 12px;">
        <i class="fas fa-rocket"></i> Create Account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{% url 'login' %}">Sign in</a>
    </div>
  </div>
</div>

<script>
document.getElementById('pwd').addEventListener('input', function() {
  const v = this.value;
  const bar = document.getElementById('pwdBar');
  let score = 0;
  if (v.length >= 6) score++;
  if (v.length >= 10) score++;
  if (/[A-Z]/.test(v)) score++;
  if (/[0-9]/.test(v)) score++;
  if (/[^A-Za-z0-9]/.test(v)) score++;
  const colors = ['#f43f5e','#f59e0b','#f59e0b','#10b981','#10b981'];
  bar.style.width = (score * 20) + '%';
  bar.style.background = colors[score - 1] || 'transparent';
});
</script>
{% endblock %}
